[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "network-anomaly-detection"
version = "0.1.0"
description = "Statistical monitoring for lane-level on-time-performance drift in parcel networks: empirical-Bayes shrinkage + CUSUM, benchmarked against the monthly OTP report."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Imran Ahamed" }]
keywords = ["logistics", "anomaly-detection", "cusum", "on-time-delivery", "statistical-process-control"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Deliberately light: this is a statistical-monitoring use case, and running it
# anywhere (an ops laptop, a cron container) without a GPU-sized dependency
# tree is part of the point.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4,<0.16"]

[project.scripts]
network-anomaly = "network_anomaly.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
