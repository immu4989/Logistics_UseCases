[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "volume-forecasting"
version = "0.1.0"
description = "End-to-end ML pipeline for forecasting daily inbound parcel volume per hub (point + quantile), so operations can staff and position capacity before the wave arrives."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Imran Ahamed" }]
keywords = ["logistics", "demand-forecasting", "time-series", "machine-learning", "shap", "supply-chain"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    # shap releases that understand xgboost 3.x model dumps need Python >=3.12,
    # so older interpreters get the proven xgboost 2.x + shap 0.4x pairing.
    "xgboost>=3.0; python_version >= '3.12'",
    "xgboost>=2.0,<3.0; python_version < '3.12'",
    "shap>=0.52; python_version >= '3.12'",
    "shap>=0.46,<0.49; python_version < '3.12'",
    "matplotlib>=3.8",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]
# Foundation-model benchmark (README section "Foundation models vs gradient
# boosting"). Deliberately NOT in default deps: torch is a ~200MB wheel and
# neither CI nor the core pipeline needs it.
fm = ["chronos-forecasting>=1.4", "torch>=2.3"]

[project.scripts]
volume-forecast = "volume_forecasting.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
