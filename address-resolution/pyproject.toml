[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "address-resolution"
version = "0.1.0"
description = "Match free-text shipping-label addresses to canonical delivery points, with a reject-to-review option, staged like production resolvers: normalize, block, score, decide."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Imran Ahamed" }]
keywords = ["logistics", "address-matching", "entity-resolution", "record-linkage", "machine-learning"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# No gradient boosting and no SHAP on purpose: the pair scorer is a logistic
# regression because its coefficients ARE the per-match explanation shown to
# the review queue (see src/address_resolution/train.py).
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4,<0.16"]

[project.scripts]
address-resolve = "address_resolution.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
