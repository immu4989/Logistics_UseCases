[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delivery-commit"
version = "0.1.0"
description = "End-to-end ML pipeline for predicting missed delivery commitments (on-time performance) in parcel logistics, with SHAP-based driver analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Imran Ahamed" }]
keywords = ["logistics", "on-time-delivery", "machine-learning", "shap", "supply-chain"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    # shap releases that understand xgboost 3.x model dumps need Python >=3.12,
    # so older interpreters get the proven xgboost 2.x + shap 0.4x pairing.
    "xgboost>=3.0; python_version >= '3.12'",
    "xgboost>=2.0,<3.0; python_version < '3.12'",
    "shap>=0.52; python_version >= '3.12'",
    "shap>=0.46,<0.49; python_version < '3.12'",
    "matplotlib>=3.8",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4,<0.16"]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[project.scripts]
delivery-commit = "delivery_commit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
